<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Sai Nandhini Tasty World</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #ece0cc;
        color: #234d1b;
        padding: 24px;
        text-align: center;
      }
      .card { max-width: 420px; }
      .badge {
        width: 88px;
        height: 88px;
        margin: 0 auto 24px;
        border-radius: 50%;
        background: #3d7935;
        border: 4px solid #f8bf51;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ece0cc;
        font-size: 32px;
        font-weight: 700;
      }
      h1 { font-size: 22px; margin: 0 0 10px; }
      p { margin: 0 0 24px; line-height: 1.5; color: #4b5563; }
      button {
        background: #3d7935;
        color: #fff;
        border: 0;
        border-radius: 999px;
        padding: 12px 28px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      button:active { transform: scale(0.98); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">ST</div>
      <h1>You're offline</h1>
      <p>
        We can't reach Sai Nandhini Tasty World right now. Check your connection
        and try again.
      </p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
